<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="icon" href="images/icons8-arrow-100.png" type="image/x-icon">
    <title>Conhecendo os displays</title>
</head>
<body>
    <header>
        <h1>Conhecendo os displays do CSS</h1>
        <main>
            <section>
                <h2>Display: block</h2>
                <div class="container-block">
                    <div class="item-block">Item 1</div>
                    <div class="item-block">Item 2</div>
                    <div class="item-block">Item 3</div>
                </div>
                <p>Os elementos são blocos que ocupam a linha toda</p>
            </section>

            <section>
                <h2>Display inline</h2>
                <div class="container-block">
                    <div class="item-block">Item 1</div>
                    <div class="item-block">Item 2</div>
                    <div class="item-block">Item 3</div>
                </div>
                <p>Elemntos ficam em linha e respeeitam o tamanho do conteudo</p>
            </section>

        </main> 
        <footer>
            <p>Projeto de compreeensão de displays CSS</p>
        </footer>

    </header>
</body>
</html>
